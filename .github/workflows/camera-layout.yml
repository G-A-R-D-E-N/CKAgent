name: camera layout

# The plugin decodes the scene camera through hand-measured offsets, so a change to those constants has to
# fail here rather than ship as a wrong pose.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  layout:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Measured camera layout still matches the plugin
        shell: pwsh
        run: ./tools/camera-layout.test.ps1 -Evidence camera-layout.json

      - name: A drifted offset is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/Agent.cpp -Raw) -replace 'kNiCameraWorld = 0x70', 'kNiCameraWorld = 0x74' |
            Set-Content drift/Agent.cpp
          ./tools/camera-layout.test.ps1 -Plugin drift/Agent.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the layout test accepted a drifted kNiCameraWorld' }
          $global:LASTEXITCODE = 0

      - name: A drifted row stride is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/Agent.cpp -Raw) -replace 'kNiRowStride = 4', 'kNiRowStride = 3' |
            Set-Content drift/Agent.cpp
          ./tools/camera-layout.test.ps1 -Plugin drift/Agent.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the layout test accepted a drifted kNiRowStride' }
          $global:LASTEXITCODE = 0

      - name: An orbit that no longer circles the pivot is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/AgentFrame.cpp -Raw) -replace 'x - distance \*', 'x + distance *' |
            Set-Content drift/AgentFrame.cpp
          ./tools/camera-layout.test.ps1 -Frame drift/AgentFrame.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the layout test accepted an orbit placing the camera on the far side of the pivot' }
          $global:LASTEXITCODE = 0

      - name: An aim check that grades its own write is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/Agent.cpp -Raw) -replace 'out\[0\] = rotate\[0\]', 'out[0] = rotate[kNiRowStride + 0]' |
            Set-Content drift/Agent.cpp
          ./tools/camera-layout.test.ps1 -Plugin drift/Agent.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the layout test accepted an aim check reading the node row it wrote' }
          $global:LASTEXITCODE = 0

      - name: A drifted current-cell offset is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/Agent.cpp -Raw) -replace 'kCurrentCellOffset = 0xF8', 'kCurrentCellOffset = 0xF0' |
            Set-Content drift/Agent.cpp
          ./tools/camera-layout.test.ps1 -Plugin drift/Agent.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted a drifted kCurrentCellOffset' }
          $global:LASTEXITCODE = 0

      - name: A renamed cell key is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/Agent.cpp -Raw) -replace '\\"editorId\\"', '\"editor_id\"' |
            Set-Content drift/Agent.cpp
          ./tools/camera-layout.test.ps1 -Plugin drift/Agent.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted a cell reply renamed to editor_id while the server and the probe still read editorId' }
          $global:LASTEXITCODE = 0

      - name: A cell read that ignores the constant is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/Agent.cpp -Raw) -replace 'g_renderWindow \+ kCurrentCellOffset', 'g_renderWindow + 0xF8' |
            Set-Content drift/Agent.cpp
          ./tools/camera-layout.test.ps1 -Plugin drift/Agent.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted a cell read that hard-codes the offset instead of using the constant' }
          $global:LASTEXITCODE = 0

      - name: A probe that stops asserting a key is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content tools/cell-probe.ps1 -Raw) -replace "foreach \(\`$key in 'interior', 'gridX', 'gridY', 'hasWorldSpace'\)", "foreach (`$key in 'interior', 'gridX')" |
            Set-Content drift/cell-probe.ps1
          ./tools/camera-layout.test.ps1 -Probe drift/cell-probe.ps1
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted a probe that no longer asserts gridY or hasWorldSpace' }
          $global:LASTEXITCODE = 0

      - name: Framing that ignores the object's bounds is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/AgentFrame.cpp -Raw) -replace 'hit\.ref->GetBoundMin\(\)', 'NiPoint3{}' -replace 'hit\.ref->GetBoundMax\(\)', 'NiPoint3{}' |
            Set-Content drift/AgentFrame.cpp
          ./tools/camera-layout.test.ps1 -Frame drift/AgentFrame.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted framing that reads no bounds, so a bulb and a building get one standoff' }
          $global:LASTEXITCODE = 0

      - name: A fixed standoff is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/AgentFrame.cpp -Raw) -replace 'requestedDistance > 0\.0f \? requestedDistance : kFrameFit \* radius', 'requestedDistance > 0.0f ? requestedDistance : 256.0f' |
            Set-Content drift/AgentFrame.cpp
          ./tools/camera-layout.test.ps1 -Frame drift/AgentFrame.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted the fixed 256 standoff that ignores the object size' }
          $global:LASTEXITCODE = 0

      - name: An orbit that cannot take a reference name is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/AgentFrame.cpp -Raw) -replace 'if \(!IsNumber\(words\[0\]\)\)', 'if (false)' |
            Set-Content drift/AgentFrame.cpp
          ./tools/camera-layout.test.ps1 -Frame drift/AgentFrame.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted an orbit that reads every target as world coordinates' }
          $global:LASTEXITCODE = 0

      - name: A rotate that trusts its own call is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/AgentFrame.cpp -Raw) -replace 'const bool changed = matrixDelta > 1e-4;', 'const bool changed = true;' |
            Set-Content drift/AgentFrame.cpp
          ./tools/camera-layout.test.ps1 -Frame drift/AgentFrame.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted a rotate that never compares the view it produced' }
          $global:LASTEXITCODE = 0

      - name: A lens that trusts its own write is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/AgentFrame.cpp -Raw) -replace 'const Lens after = ReadLens\(camera, slave\)', 'const Lens after = before' |
            Set-Content drift/AgentFrame.cpp
          ./tools/camera-layout.test.ps1 -Frame drift/AgentFrame.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted a lens report that never re-reads the frustum it just wrote' }
          $global:LASTEXITCODE = 0

      - name: A lens with no range check is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content plugin/AgentFrame.cpp -Raw) -replace 'requestedFov > 1\.0f && requestedFov < 179\.0f', 'requestedFov > 0\.0f' |
            Set-Content drift/AgentFrame.cpp
          ./tools/camera-layout.test.ps1 -Frame drift/AgentFrame.cpp
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted a field of view with no upper bound' }
          $global:LASTEXITCODE = 0

      - name: A cross-check narrowed to one pose is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content tools/camera-tool-cross-check.ps1 -Raw) -replace '\[double\[\]\]\$YawDegrees = @\(0, 30, 45, 60, 90, 120, 135, 180, 225, 270, 315\)', '[double[]]$YawDegrees = @(0)' |
            Set-Content drift/cross.ps1
          ./tools/camera-layout.test.ps1 -Cross drift/cross.ps1
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted a cross-check narrowed to one axis-aligned pose, where a wrong shift still predicts 6.0' }
          $global:LASTEXITCODE = 0

      - name: A cross-check with a widened tolerance is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content tools/camera-tool-cross-check.ps1 -Raw) -replace '0\.0004', '0.5' |
            Set-Content drift/cross.ps1
          ./tools/camera-layout.test.ps1 -Cross drift/cross.ps1
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted a cross-check whose tolerance absorbs a shift error' }
          $global:LASTEXITCODE = 0

      - name: A cross-check documented under the wrong path is rejected
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force drift | Out-Null
          (Get-Content docs/ck-agent-mcp.md -Raw) -replace 'tools/camera-tool-cross-check\.ps1', 'tools/ck-surface-probe/camera-tool-cross-check.ps1' |
            Set-Content drift/doc.md
          ./tools/camera-layout.test.ps1 -Docs drift/doc.md
          if ($LASTEXITCODE -eq 0) { throw 'the test accepted docs naming the cross-check under a directory it is not in' }
          $global:LASTEXITCODE = 0

      - name: Keep the evidence
        uses: actions/upload-artifact@v4
        with:
          name: camera-layout
          path: camera-layout.json
          if-no-files-found: error
